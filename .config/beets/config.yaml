# configuration for https://beets.io
# https://beets.readthedocs.io/en/stable/reference/config.html
#
# To install `beets` on macOS:
#
# $ brew install uv
# $ uv tool install beets --with requests --with certifi --with bs4 --with pylast --with pillow
#
# `pylast` is what lastgenre talks to Last.fm with. `pillow` is what resizes
# cover art — without a local backend, embedart silently drops `maxwidth`.
#
# The badfiles plugin shells out to external binaries, not python modules:
#
# $ brew install mp3val
#
# Without mp3val, `beet bad` reports "command not found" per mp3 and checks
# nothing. ffmpeg is already installed for convert.

# Store music library in ~/Documents/music, which is on iCloud
directory: ~/Documents/music

# https://beets.readthedocs.io/en/stable/plugins/index.html
#
# https://beets.readthedocs.io/en/stable/plugins/badfiles.html
# https://beets.readthedocs.io/en/stable/plugins/convert.html
# https://beets.readthedocs.io/en/stable/plugins/duplicates.html
# https://beets.readthedocs.io/en/stable/plugins/embedart.html
# https://beets.readthedocs.io/en/stable/plugins/fetchart.html
# https://beets.readthedocs.io/en/stable/plugins/fish.html
# https://beets.readthedocs.io/en/stable/plugins/info.html
# https://beets.readthedocs.io/en/stable/plugins/lastgenre.html
# https://beets.readthedocs.io/en/stable/plugins/lyrics.html
# https://beets.readthedocs.io/en/stable/plugins/mbsync.html
# https://beets.readthedocs.io/en/stable/plugins/musicbrainz.html
plugins: badfiles convert duplicates embedart fetchart fish info lastgenre lyrics mbsync musicbrainz

# Corruption scan for the library: `beet bad`. Shells out to external checkers
# (`mp3val` for mp3, `flac -wst` for flac); there is no checker for alac/aac, so
# the ~790 m4a tracks report "no supported tags" and go unverified.
#
# Deliberately no `check_on_import` — it ignores `--quiet`, so it turns an
# unattended import into one that stops and waits on every warning.
# Do NOT add `commands: {mp3: mp3val}` here. It looks like a no-op restatement
# of the default, but it swaps the built-in `check_mp3val` for `check_custom`,
# which only reports a problem when the checker *exits* nonzero. mp3val exits 0
# on warnings, so the override silently reports a perfectly clean library.
# `check_mp3val` greps the output for WARNING: lines instead (badfiles.py:67).
badfiles: {}

# Keep the library playable in Music.app: transcode lossless imports
# (e.g. FLAC) to ALAC, leaving already-lossy files untouched.
convert:
    auto: yes
    format: alac
    never_convert_lossy_files: yes
    # `dest` means two opposite things depending on `-k`/`--keep-new`:
    #
    #   beet convert -k <query>   originals move HERE, transcodes go to the library
    #   beet convert <query>      transcodes go HERE, originals stay in the library
    #
    # So only ever convert into this directory with `-k`. Without it, a plain
    # `beet convert` writes .m4a transcodes into what is meant to be an archive
    # of untouched originals.
    #
    # `auto: yes` above is unaffected either way — it transcodes via a temp file
    # and repoints the library entry at it, never reading `dest`.
    dest: ~/Music/flac-originals
    # For lossy formats (e.g. opus from YouTube) that Music.app can't play,
    # use: beet convert -f aac -k <query>  (uses beets' built-in aac preset)

# Fetch cover art even for as-is imports, which otherwise get none (beets 2.13).
fetchart:
    fetch_for_asis: yes

# Every track carries its own copy of the album cover, so an uncapped image is
# paid for once per track — the Zelda: TotK soundtrack alone spent 1.4 GiB on
# 344 copies of one 4 MiB image. `maxwidth` bounds the longest side, resizing
# with Lanczos to a temp file, so the full-resolution cover.jpg on disk is left
# alone and only the embedded copy shrinks. Shrink-only: smaller art is
# untouched. `quality` would otherwise fall back to PIL's default of 75.
#
# Needs a resize backend (see pillow, above). ImageMagick takes precedence over
# PIL if it's ever installed, and caps width rather than longest side.
embedart:
    maxwidth: 1000
    quality: 85

# Default keys are mb_trackid + mb_albumid, but non-strict mode *drops* keys that
# are empty — so every track missing an mb_trackid collides with its albummates
# on mb_albumid alone. That reported all the alternate takes on the deluxe
# `A Charlie Brown Christmas` as duplicates of each other. `strict` requires
# every key to be present instead, which skips those rather than mismatching them.
duplicates:
    strict: yes

# Fills in genres from Last.fm. `force` defaults to no, so this only fills gaps
# and won't overwrite genres already on a track. `aliases` (on by default as of
# 2.13) folds spelling variants together, e.g. hip hop / hip-hop / Hip Hop.
lastgenre:
    auto: yes

# Last.fm has no tags for a lot of small-label and Bandcamp releases, so
# `lastgenre` leaves them blank; MusicBrainz carries curated genres for some of
# the same albums. `genres` is off by default, which is why those never arrived.
# `genres_tag` defaults to `genre` (MB's *curated* genre list) rather than `tag`
# (raw user folksonomy) — keep it that way. Genres from the release and its
# release group are merged and sorted by vote count, most-voted first.
#
# This only populates during a match, so backfilling existing albums needs
# `beet mbsync`. Preview with `-p` first: mbsync refreshes every field from MB,
# not just genre.
musicbrainz:
    genres: yes

# LRClib is free and open; add a genius_api_key to re-enable Genius.
lyrics:
    sources: [lrclib]
    # `instrumental` is hand-maintained; `lyrics_instrumental` is set by beets
    # itself whenever a backend returns "[Instrumental]" (2.13). Match either,
    # since the latter keeps accruing new items on its own.
    auto_ignore: "instrumental:true , lyrics_instrumental:true"
