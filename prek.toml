# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "nvim-treesitter-injections",
    name = "nvim treesitter injections smoke test",
    entry = "just test-injections",
    language = "system",
    files = "^\\.config/nvim/(after/queries/.*\\.scm|test/injections_spec\\.lua)$",
    pass_filenames = false,
  },
  {
    id = "fnlfmt-check",
    name = "fnlfmt",
    entry = "just fnlfmt-check",
    language = "system",
    files = "\\.fnl$",
  },
  {
    id = "fish-format-check",
    name = "fish_indent --check",
    entry = "just fish-format-check",
    language = "system",
    files = "\\.fish$",
  },
  {
    id = "rumdl",
    name = "rumdl (fix with `just markdown-format`)",
    entry = "just markdown-check",
    language = "system",
    files = "\\.md$",
  },
  # Python scripts in `.local/bin` have no extension, so the recipes pick
  # files by shebang instead of prek's `types`.
  {
    id = "python-lint",
    name = "ruff (fix with `ruff check --fix` / `ruff format`)",
    entry = "just python-lint",
    language = "system",
    types = ["text"],
  },
  {
    id = "python-typecheck",
    name = "ty",
    entry = "just python-typecheck",
    language = "system",
    types = ["text"],
  },
  # Without --quiet the failure output is the whole formatted file, not a delta.
  {
    id = "just-format-check",
    name = "just --fmt --check (fix with `just --fmt`)",
    entry = "just --fmt --check --quiet",
    language = "system",
    files = "^justfile$",
    pass_filenames = false,
  },
]
